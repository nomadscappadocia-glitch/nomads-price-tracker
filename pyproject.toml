[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelrate"
version = "0.1.0"
description = "Multi-source hotel rate crawler MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "httpx>=0.28.0",
  "playwright>=1.52.0",
  "apscheduler>=3.11.0",
  "python-dateutil>=2.9.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
